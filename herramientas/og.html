<!DOCTYPE html>
<!-- Fuente de /og.png (1200 x 630). Para regenerarla, desde la raíz del repo:
     msedge --headless --disable-gpu --hide-scrollbars --window-size=1200,630 --screenshot=og.png herramientas/og.html -->
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500&family=Marcellus&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:radial-gradient(120% 90% at 85% 10%,#2C2924 0%,#1C1A17 60%);color:#ECE6DA;font-family:'Alegreya Sans',sans-serif;
    display:grid;grid-template-columns:1fr 510px;align-items:center;padding:0 80px;box-sizing:border-box}
  h1{font:400 112px/1 Marcellus,serif;margin:0;letter-spacing:.01em}
  p{font-size:34px;line-height:1.35;color:#A8A195;margin:28px 0 0;max-width:500px}
  .tag{margin-top:44px;font-size:24px;color:#B89463}
  .cols{display:flex;gap:15px;align-items:flex-end;justify-content:flex-end}
  .col{width:60px}
  .col svg{display:block;width:60px;height:120px}
  .stone{fill:#34302A}
  .fill{fill:#B89463}
  .flutes{fill:#1C1A17;opacity:.35}
  .d{font:400 24px Marcellus,serif;text-align:center;margin-top:12px;color:#9A9285}
  .col.full .d{color:#B89463}
</style>
</head>
<body>
  <div>
    <h1>Estoico</h1>
    <p>Hábitos de mente, cuerpo y alma en ciclos de 12 semanas.</p>
    <div class="tag">Con registro de entrenamiento</div>
  </div>
  <div class="cols" id="cols"></div>
<script>
  // La columnata de Registro: el fuste se llena según el % de cada día
  const pct = [1, 1, .75, 1, .5, .25, 0], dias = 'LMMJVSD';
  document.getElementById('cols').innerHTML = pct.map((p, i) => {
    const h = 40 * p, y = 12 + 40 - h;
    return `<div class="col${p === 1 ? ' full' : ''}"><svg viewBox="0 0 32 64">
      <rect class="${p === 1 ? 'fill' : 'stone'}" x="2" y="2" width="28" height="5" rx="1"/>
      <path class="${p === 1 ? 'fill' : 'stone'}" d="M4 7h24l-3 4H7z"/>
      <rect class="stone" x="7" y="12" width="18" height="40"/>
      <rect class="fill" x="7" y="${y}" width="18" height="${h}"/>
      <rect class="flutes" x="11" y="12" width="1.5" height="40"/><rect class="flutes" x="15.25" y="12" width="1.5" height="40"/><rect class="flutes" x="19.5" y="12" width="1.5" height="40"/>
      <rect class="${p === 1 ? 'fill' : 'stone'}" x="5" y="53" width="22" height="4" rx="1"/>
      <rect class="${p === 1 ? 'fill' : 'stone'}" x="2" y="58" width="28" height="5" rx="1"/>
    </svg><div class="d">${dias[i]}</div></div>`;
  }).join('');
</script>
</body>
</html>
