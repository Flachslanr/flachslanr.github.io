<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12141A">
<title>Entreno — Estoico</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Programa de calistenia de 4 días con registro de series.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/entreno.css">
</head>
<body data-app="entreno">

<header class="top">
  <div class="top-inner">
    <div class="top-row">
      <p class="eyebrow" id="h-eyebrow">Calistenia · 12 semanas</p>
      <a class="back" href="/">← Estoico</a>
    </div>
    <h1 class="brand">Entreno</h1>
    <div class="cycle"><span id="h-semana">Semana 1 de 12</span><span id="h-fase"></span></div>
    <div class="bar"><i id="h-bar" style="width:8%"></i></div>
  </div>
</header>

<main>
  <section class="view" id="view-sesion"></section>
  <section class="view" id="view-plan" hidden></section>
  <section class="view" id="view-progreso" hidden></section>
  <section class="view" id="view-ajustes" hidden></section>
</main>

<div class="timer" id="timer" hidden>
  <div class="tt" id="t-time">0:00</div>
  <div class="lbl" id="t-lbl">Descanso</div>
  <button class="btn" id="t-plus" type="button">+15 s</button>
  <button class="btn" id="t-stop" type="button">Listo</button>
</div>

<nav class="nav" aria-label="Secciones">
  <div class="nav-inner" role="tablist">
    <button role="tab" data-view="sesion" aria-selected="true">
      <svg class="icon" aria-hidden="true"><use href="#i-flame"/></svg><span>Sesión</span></button>
    <button role="tab" data-view="plan" aria-selected="false">
      <svg class="icon" aria-hidden="true"><use href="#i-list"/></svg><span>Plan</span></button>
    <button role="tab" data-view="progreso" aria-selected="false">
      <svg class="icon" aria-hidden="true"><use href="#i-trend"/></svg><span>Progreso</span></button>
    <button role="tab" data-view="ajustes" aria-selected="false">
      <svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg><span>Ajustes</span></button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/shared.js"></script>
<script type="module" src="/entreno-app.js"></script>
</body>
</html>
