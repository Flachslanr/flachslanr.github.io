<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12141A">
<title>Entreno — Estoico</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Programa de calistenia de 4 días con registro de series.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/entreno.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="top-row">
      <p class="eyebrow" id="h-eyebrow">Calistenia · 12 semanas</p>
      <a class="back" href="/">← Estoico</a>
    </div>
    <h1 class="brand">Entreno</h1>
    <div class="cycle"><span id="h-semana">Semana 1 de 12</span><span id="h-fase"></span></div>
    <div class="bar"><i id="h-bar" style="width:8%"></i></div>
  </div>
</header>

<main>
  <section class="view" id="view-sesion"></section>
  <section class="view" id="view-plan" hidden></section>
  <section class="view" id="view-progreso" hidden></section>
  <section class="view" id="view-ajustes" hidden></section>
</main>

<div class="timer" id="timer" hidden>
  <div class="tt" id="t-time">0:00</div>
  <div class="lbl" id="t-lbl">Descanso</div>
  <button class="btn" id="t-plus" type="button">+15 s</button>
  <button class="btn" id="t-stop" type="button">Listo</button>
</div>

<nav class="nav" aria-label="Secciones">
  <div class="nav-inner" role="tablist">
    <button role="tab" data-view="sesion" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg><span>Sesión</span></button>
    <button role="tab" data-view="plan" aria-selected="false">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Plan</span></button>
    <button role="tab" data-view="progreso" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg><span>Progreso</span></button>
    <button role="tab" data-view="ajustes" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span>Ajustes</span></button>
  </div>
</nav>

<div class="toast" id="toast" hidden></div>

<script type="module" src="/entreno-app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch((e) => console.warn(e));
  });
}
</script>
</body>
</html>
