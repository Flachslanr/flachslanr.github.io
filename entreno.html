<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C1A17">
<title>Entreno — Estoico</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estoico">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Programa de calistenia de 4 días con registro de series.">
<link rel="canonical" href="https://flachslanr.github.io/entreno.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Estoico">
<meta property="og:locale" content="es_AR">
<meta property="og:url" content="https://flachslanr.github.io/entreno.html">
<meta property="og:title" content="Entreno — Estoico">
<meta property="og:description" content="Programa de calistenia de 12 semanas con registro de series, descansos y récords.">
<meta property="og:image" content="https://flachslanr.github.io/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Estoico: ciclos de 12 semanas de hábitos de mente, cuerpo y alma.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="/entreno.css">
</head>
<body data-app="entreno">

<header class="top">
  <div class="wrap top-row">
    <div class="top-txt">
      <h1 class="brand">Entreno</h1>
      <p class="top-sub" id="h-eyebrow">Calistenia en 12 semanas</p>
    </div>
    <a class="pill" href="/"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>Estoico</a>
    <div id="h-ring"></div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-sesion" role="tabpanel" aria-labelledby="tab-sesion"></section>
  <section class="view" id="view-plan" role="tabpanel" aria-labelledby="tab-plan" hidden></section>
  <section class="view" id="view-progreso" role="tabpanel" aria-labelledby="tab-progreso" hidden></section>
  <section class="view" id="view-ajustes" role="tabpanel" aria-labelledby="tab-ajustes" hidden></section>
</main>

<!-- Descanso: anillo que se vacía -->
<div class="rest" id="timer" role="timer" aria-label="Descanso">
  <svg class="rest-ring" viewBox="0 0 64 64" aria-hidden="true">
    <circle class="bgc" cx="32" cy="32" r="27"/>
    <circle class="fg" id="t-ring" cx="32" cy="32" r="27" stroke-dasharray="169.65" stroke-dashoffset="0" transform="rotate(-90 32 32)"/>
    <text id="t-time" x="32" y="37" text-anchor="middle">0:00</text>
  </svg>
  <div class="rest-t"><b id="t-title" aria-live="polite">Descanso</b><span id="t-lbl"></span></div>
  <button class="btn" id="t-plus" type="button">+15 s</button>
  <button class="btn btn-primary" id="t-stop" type="button">Listo</button>
</div>

<!-- Hoja para cargar una serie -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" inert>
  <div class="grab" aria-hidden="true"></div>
  <p class="eyebrow" id="sh-ex">Ejercicio</p>
  <h2 class="sheet-title" id="sh-title" tabindex="-1">Serie 1</h2>
  <p class="sheet-prev" id="sh-prev"></p>
  <div class="stepper">
    <button class="stepper-btn" id="sh-minus" type="button" aria-label="Restar"><svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
    <div class="stepper-val">
      <input id="sh-val" inputmode="decimal" autocomplete="off" aria-describedby="sh-unit">
      <label id="sh-unit" for="sh-val">reps</label>
    </div>
    <button class="stepper-btn" id="sh-plus" type="button" aria-label="Sumar"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
  </div>
  <div class="sheet-actions">
    <button class="btn btn-primary btn-lg btn-block" id="sh-save-rest" type="button">Guardar e iniciar descanso</button>
    <div class="sheet-row">
      <button class="btn btn-block" id="sh-save" type="button">Guardar</button>
      <button class="btn btn-ghost btn-danger" id="sh-clear" type="button">Borrar</button>
    </div>
  </div>
</div>

<nav class="tabbar" aria-label="Secciones">
  <div class="tabbar-inner" role="tablist">
    <button class="tab" role="tab" type="button" id="tab-sesion" data-view="sesion" aria-controls="view-sesion" aria-selected="true" tabindex="0"><svg class="icon" aria-hidden="true"><use href="#i-flame"/></svg><span>Sesión</span></button>
    <button class="tab" role="tab" type="button" id="tab-plan" data-view="plan" aria-controls="view-plan" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg><span>Plan</span></button>
    <button class="tab" role="tab" type="button" id="tab-progreso" data-view="progreso" aria-controls="view-progreso" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-trend"/></svg><span>Progreso</span></button>
    <button class="tab" role="tab" type="button" id="tab-ajustes" data-view="ajustes" aria-controls="view-ajustes" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg><span>Ajustes</span></button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/shared.js"></script>
<script type="module" src="/entreno-app.js"></script>
</body>
</html>
